<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Beamline — laser mirror puzzle</title>
  <meta name="description" content="Bend a laser with mirrors to light up every gem. 120 levels across 6 worlds with splitters, portals and mines, plus a daily challenge.">
  <meta name="theme-color" content="#0b0d17">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/fredoka.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/lilita-one.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body data-world="0">
  <!-- MENU -->
  <section class="screen hidden" id="screen-menu">
    <div class="corner-btns">
      <button class="icon-btn music-btn" aria-label="Toggle music">♪</button>
      <button class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="menu">
      <img class="menu-logo" src="logo.svg" alt="Beamline" width="548" height="312">
      <button class="btn primary big" id="btn-play">Play</button>
      <div class="menu-row">
        <button class="btn ghost" id="btn-levels">Levels</button>
        <button class="btn ghost" id="btn-daily">Daily <span class="badge hidden" id="daily-badge">NEW</span></button>
      </div>
      <div class="menu-stats" id="menu-stats"></div>
    </div>
  </section>

  <!-- LEVEL SELECT -->
  <section class="screen hidden" id="screen-levels">
    <header class="bar">
      <button class="icon-btn" data-go="menu" aria-label="Home">⌂</button>
      <h2>Levels <span class="star-total" id="star-total"></span></h2>
      <div class="bar-right">
        <button class="btn ghost small" id="btn-daily-2">Daily <span class="badge hidden" id="daily-badge-2">NEW</span></button>
      </div>
    </header>
    <nav class="worlds" id="world-tabs"></nav>
    <div class="level-grid" id="level-grid"></div>
  </section>

  <!-- GAME -->
  <section class="screen hidden" id="screen-game">
    <header class="bar">
      <button class="icon-btn" id="btn-back" aria-label="Back to levels">‹</button>
      <div class="title">
        <h2 id="game-title">Level 1</h2>
        <small id="game-sub"></small>
      </div>
      <div class="bar-right">
        <button class="icon-btn music-btn" aria-label="Toggle music">♪</button>
        <button class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
        <button class="icon-btn" id="btn-restart" aria-label="Restart level">↻</button>
      </div>
    </header>
    <div class="game">
      <aside class="side">
        <div class="hud">
          <div class="pill" id="pill-mirrors"><span class="k">Mirrors</span><b id="hud-mirrors">0</b></div>
          <div class="pill"><span class="k">Gems</span><b id="hud-gems">0/0</b></div>
          <div class="pill"><span class="k">Placed</span><b id="hud-moves">0</b><small id="hud-par"></small></div>
        </div>
        <p class="tip hidden" id="tip"></p>
        <div class="controls">
          <button class="btn ghost" id="btn-undo">Undo</button>
          <button class="btn ghost" id="btn-hint">Hint <span class="badge" id="hint-count">3</span></button>
        </div>
      </aside>
      <div class="board-wrap">
        <svg id="board" aria-label="Puzzle board"></svg>
      </div>
    </div>
  </section>

  <!-- OVERLAYS -->
  <div class="overlay hidden" id="ov-win">
    <div class="card">
      <h2 id="win-title">Level complete!</h2>
      <div class="stars" id="win-stars"><span>★</span><span>★</span><span>★</span></div>
      <p class="muted" id="win-line"></p>
      <p class="hidden" id="win-extra"></p>
      <div class="card-actions">
        <button class="btn primary big" id="btn-next">Next level</button>
        <div class="menu-row">
          <button class="btn ghost" id="btn-replay">Replay</button>
          <button class="btn ghost" id="btn-win-levels">Levels</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ov-hint">
    <div class="card">
      <h2>Stuck?</h2>
      <p class="muted">Watch a short video for some help.</p>
      <div class="card-actions">
        <button class="btn primary big" id="btn-hint-watch">▶ Reveal a mirror</button>
        <button class="btn ghost" id="btn-skip-watch">▶ Skip this level</button>
        <button class="btn link" id="btn-hint-cancel">Keep trying</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ov-feature">
    <div class="card">
      <div class="new-tag">NEW!</div>
      <svg class="feature-art" id="feature-art" viewBox="0 0 100 50" aria-hidden="true"></svg>
      <h2 id="feature-title"></h2>
      <p class="muted" id="feature-text"></p>
      <div class="card-actions">
        <button class="btn primary big" id="btn-feature-ok">Got it!</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ov-ad">
    <div class="spinner" aria-label="Loading"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="platform.js"></script>
  <script src="audio.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
