<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Beamline — laser mirror puzzle</title>
  <meta name="description" content="Bend a laser with mirrors to light every gem. 120 levels across 6 worlds, plus a daily challenge.">
  <meta name="theme-color" content="#0b0d17">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- MENU -->
  <section class="screen" id="screen-menu">
    <button class="icon-btn mute-btn menu-mute" aria-label="Toggle sound">🔊</button>
    <div class="menu">
      <svg class="menu-art" viewBox="0 0 120 70" aria-hidden="true">
        <polyline class="art-glow" points="0,20 80,20 80,55 120,55"/>
        <polyline class="art-core" points="0,20 80,20 80,55 120,55"/>
        <line class="art-mirror" x1="73" y1="13" x2="87" y2="27"/>
        <line class="art-mirror" x1="73" y1="62" x2="87" y2="48"/>
        <path class="art-gem" d="M40 13 L47 20 L40 27 L33 20Z"/>
        <path class="art-gem" d="M80 31 L87 38 L80 45 L73 38Z"/>
        <path class="art-gem" d="M103 48 L110 55 L103 62 L96 55Z"/>
      </svg>
      <h1 class="logo">Beam<span>line</span></h1>
      <p class="tagline">Bend the beam. Light every gem.</p>
      <button class="btn primary big" id="btn-play">Play</button>
      <div class="menu-row">
        <button class="btn ghost" id="btn-levels">Levels</button>
        <button class="btn ghost" id="btn-daily">Daily <span class="badge hidden" id="daily-badge">NEW</span></button>
      </div>
      <div class="menu-stats" id="menu-stats"></div>
    </div>
  </section>

  <!-- LEVEL SELECT -->
  <section class="screen hidden" id="screen-levels">
    <header class="bar">
      <button class="icon-btn" data-go="menu" aria-label="Back">‹</button>
      <h2>Levels</h2>
      <div class="bar-right"><span class="star-total" id="star-total"></span></div>
    </header>
    <nav class="worlds" id="world-tabs"></nav>
    <div class="level-grid" id="level-grid"></div>
  </section>

  <!-- GAME -->
  <section class="screen hidden" id="screen-game">
    <header class="bar">
      <button class="icon-btn" id="btn-back" aria-label="Back to levels">‹</button>
      <h2 id="game-title">Level 1</h2>
      <div class="bar-right">
        <button class="icon-btn mute-btn" aria-label="Toggle sound">🔊</button>
        <button class="icon-btn" id="btn-restart" aria-label="Restart level">↻</button>
      </div>
    </header>
    <div class="game">
      <aside class="side">
        <div class="hud">
          <div class="pill" id="pill-mirrors"><span class="k">Mirrors</span><b id="hud-mirrors">0</b></div>
          <div class="pill"><span class="k">Gems</span><b id="hud-gems">0/0</b></div>
          <div class="pill"><span class="k">Placed</span><b id="hud-moves">0</b><small id="hud-par"></small></div>
        </div>
        <p class="tip hidden" id="tip"></p>
        <div class="controls">
          <button class="btn ghost" id="btn-undo">Undo</button>
          <button class="btn ghost" id="btn-hint">Hint <span class="badge" id="hint-count">3</span></button>
        </div>
      </aside>
      <div class="board-wrap">
        <svg id="board" aria-label="Puzzle board"></svg>
      </div>
    </div>
  </section>

  <!-- OVERLAYS -->
  <div class="overlay hidden" id="ov-win">
    <div class="card">
      <h2 id="win-title">Level complete!</h2>
      <div class="stars" id="win-stars"><span>★</span><span>★</span><span>★</span></div>
      <p class="muted" id="win-line"></p>
      <p class="muted hidden" id="win-extra"></p>
      <div class="card-actions">
        <button class="btn primary big" id="btn-next">Next level</button>
        <div class="menu-row">
          <button class="btn ghost" id="btn-replay">Replay</button>
          <button class="btn ghost" id="btn-win-levels">Levels</button>
        </div>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ov-hint">
    <div class="card">
      <h2>Need a hint?</h2>
      <p class="muted" id="hint-text">Watch a short video to reveal one mirror.</p>
      <div class="card-actions">
        <button class="btn primary big" id="btn-hint-watch">▶ Watch video</button>
        <button class="btn ghost" id="btn-hint-cancel">Keep trying</button>
      </div>
    </div>
  </div>

  <div class="overlay hidden" id="ov-ad">
    <div class="spinner" aria-label="Loading"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="platform.js"></script>
  <script src="audio.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
